{% extends "flash.html" %}
{% block body %}
<h1>{{ game.title }}</h1>
  {% if session.username %}
  <p>
    <a href=/new_item>New Seed<a/>
  </p>
  {% endif %}

  <h2>Posts</h2>
  <form action="/game/{{ game.id }}" method="get">
    <p>Search: <input type="text" name="terms" value="{{ terms }}"> <input type="submit" value="Search"></p>
  </form>
    <ul>
    {% for item in items %}
    <li><a href="/item/{{  item.id  }}">{{ item.title }}</a></li>
    {% endfor %}
    </ul>
    {% if not items %}
    <p>No results</p>
    {% endif %}
{% endblock %}
