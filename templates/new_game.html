{% extends "flash.html" %}
{% block body %}

  <h1>Add Game</h1>

  <form action="/create_game" method="post">
    <p>
      Game Title: <br />
      <input type="text" name="title" maxlength="50" required/>
    </p>
    <p>
      Allowed characters: <br />
      <select name="allowed_characters">
        <option value="">(Select)</option>
        <option value="1">All unicode characters</option>
        <option value="2">Standard English alphabet + numerals</option>
        <option value="3">Only numerals</option>
      </select>
    </p>
    <p>
      Max Length: <br />
      <input type="number" name="max_length" min="1" max="100" required/>
    </p>
    <p>
      <input type="checkbox" name="use_all" value="" />
      Seed must be as long as Max Length.
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Add Game" />
  </form>
{% endblock %}
